# Local development: docker compose up --build
services:
  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://zieon:zieon_dev@db:5432/zieon?sslmode=disable
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?generate with: openssl rand -base64 48}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?set k1:<openssl rand -base64 32>}
      ALLOWED_ORIGINS: http://localhost:5173
      SANDBOX_WEBHOOK_SECRET: dev-sandbox-secret
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zieon
      POSTGRES_PASSWORD: zieon_dev
      POSTGRES_DB: zieon
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zieon -d zieon"]
      interval: 5s
      retries: 10
