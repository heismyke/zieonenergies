# Pilot / production stack. Secrets live in .env.production on the host (mode 600).
name: zieon-prod

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://zieon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/zieon?sslmode=disable
      PORT: "8080"
      TRUST_PROXY_HEADERS: "true"
      # Returned to the platform at meter registration for device provisioning.
      MQTT_PUBLIC_URLS: ssl://zieon-api.198.199.65.142.sslip.io:8883,wss://zieon-api.198.199.65.142.sslip.io/mqtt
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - zieon-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # MQTT device gateway (same image, `api mqtt`). Kept separate so API
  # deploys do not drop meter connections.
  mqtt:
    build: .
    command: ["mqtt"]
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://zieon:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/zieon?sslmode=disable
      MQTT_TLS_ADDR: ":8883"
      MQTT_WS_ADDR: ":8083"
      # Reuse the certificate Caddy obtains and renews for the API hostname.
      # The glob tolerates Caddy switching ACME issuer directories.
      MQTT_TLS_CERT_FILE: /caddy-data/caddy/certificates/*/zieon-api.198.199.65.142.sslip.io/zieon-api.198.199.65.142.sslip.io.crt
      MQTT_TLS_KEY_FILE: /caddy-data/caddy/certificates/*/zieon-api.198.199.65.142.sslip.io/zieon-api.198.199.65.142.sslip.io.key
    # Caddy's key files are root-only (0600), so this container reads them as
    # root; it is otherwise locked down: read-only FS, no capabilities.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - caddy-data:/caddy-data:ro
    ports:
      - "8883:8883"
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - zieon-mqtt
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zieon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: zieon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zieon -d zieon"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  caddy-data:
    external: true
    name: hixmastudio-proxy_caddy-data

networks:
  proxy:
    external: true
    name: hixmastudio-proxy_default
